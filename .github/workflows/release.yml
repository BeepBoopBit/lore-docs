name: CI and publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: Check Rust ${{ matrix.rust }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.88.0"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 - <<'PY'
          import os
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["package"]["version"]
          expected = f"v{version}"
          actual = os.environ["GITHUB_REF_NAME"]
          if actual != expected:
              raise SystemExit(f"Tag {actual!r} must match Cargo.toml: {expected}")
          PY

      - name: Install Rust
        env:
          RUST_TOOLCHAIN: ${{ matrix.rust }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup override set "$RUST_TOOLCHAIN"
          if [ "$RUST_TOOLCHAIN" = stable ]; then
            rustup component add rustfmt clippy
          fi

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ matrix.rust }}-${{ hashFiles('Cargo.lock') }}

      - name: Check formatting and Clippy
        if: matrix.rust == 'stable'
        run: ./dev.sh check

      - name: Run Rust and installer tests
        if: matrix.rust == 'stable'
        run: ./dev.sh test

      - name: Check minimum Rust version
        if: matrix.rust == '1.88.0'
        run: |
          cargo build --release --locked --bin lore
          python3 - <<'PY'
          import subprocess
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["package"]["version"]
          actual = subprocess.check_output(["target/release/lore", "--version"], text=True)
          if actual.strip() != f"lore {version}":
              raise SystemExit(f"Unexpected executable identity: {actual!r}")
          PY

      - name: Check Cargo package
        if: matrix.rust == 'stable'
        run: |
          cargo package --list --locked
          cargo publish --dry-run --locked

  publish:
    name: Publish to crates.io
    needs: check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup override set stable

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "Add the CARGO_REGISTRY_TOKEN repository secret before publishing." >&2
            exit 1
          fi
          cargo publish --locked
